[project]
name = "swan-trade"
version = "0.1.0"
description = "SWAN Trade backend development environment"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.15,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.8,<3",
    "httpx>=0.28,<1",
    "websockets>=15,<17",
    "apscheduler>=3.11,<4",
    "firebase-admin>=6.7,<8",
    "google-auth>=2.0,<3",
    "cachecontrol>=0.14,<1",
    "requests>=2.0,<3",
    "pyotp==2.9.0",
    "pywebpush>=2.5.0",
    "ijson>=3.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires PostgreSQL; uses a disposable isolated schema"]
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
